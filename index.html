<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 class="logo">My Blog</h1>
        <nav>
            <a href="#" class="super-font-link">Our Story</a>
        </nav>
    </header>

    <main>
        <h2 class="main-title">Latest Videos</h2>
        <div class="video-gallery">
            <div class="video-post" data-video-id="vid-ai-tool" data-video-type="youtube">
                <img src="https://img.youtube.com/vi/piwijbHV29A/hqdefault.jpg" 
                     data-video-src="https://www.youtube.com/embed/piwijbHV29A" 
                     alt="Aarogya Sahayak AI">
                <div class="video-info">
                    <h3>Aarogya Sahayak AI</h3>
                    <p>Revolutionizing healthcare with AI-powered symptom analysis.</p>
                </div>
            </div>

            <div class="video-post" data-video-id="part2-soon">
                <img src="https://via.placeholder.com/400x225/282828/999?text=Part+2+Coming+Soon" 
                     alt="Part 2 Coming Soon">
                <div class="video-info">
                    <h3>Part 2 Coming Soon</h3>
                    <p>Stay tuned for the next exciting chapter\!.</p>
                </div>
            </div>

            </div>
    </main>

    <footer>
        <p>&copy; 2025 My Blog. All Rights Reserved.</p>
    </footer>

    <div id="video-player-overlay" class="hidden">
        <span class="close-btn">&times;</span>
        <div class="video-container">
            <div class="player-wrapper">
                <video id="main-video-player" controls></video>
                <iframe id="youtube-player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="share-controls">
                <input type="text" id="share-link-input" readonly>
                <button id="copy-link-btn">Copy Link</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
